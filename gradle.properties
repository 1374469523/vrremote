org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

# The Shizuku API ships as an AndroidX library, so the flag is required.
android.useAndroidX=true
android.nonTransitiveRClass=true

# The workspace folder name contains non-ASCII characters. AGP only warns about
# this on Windows, and the build is verified to work from this path.
android.overridePathCheck=true
